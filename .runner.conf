# reg — unattended writer config. Read by issue-runner's runner.sh and by the
# systemd unit it renders. See <harness>/templates/runner.conf.example for the
# full set of keys.
#
# KEY=value only. NEVER `export KEY=value` — systemd's EnvironmentFile discards
# those silently, and both readers refuse a file containing them.

GH_REPO=nan-bit/reg
PROJECT_NAME=reg

# Pinned: a pull in the harness checkout does not reach this project.
HARNESS_REF=v0.2.12

# Worktrees live outside the checkout so a pass cannot trip over its own output.
WORKTREES_DIR=/home/ernan/.cache/issue-runner/worktrees/reg

# Told to the agent, not enforced — real enforcement reads the diff at merge time.
RUNNER_DENYLIST=.github/** .runner.conf

# One line appended to every agent prompt. The issue is still the specification.
PROJECT_BRIEF=a reachability evidence graph — a retainable, queryable, tamper-evident audit artifact for robot autonomy. Read docs/plan.md for the argument and CLAUDE.md for the Layer A/Layer B rule before writing code.
